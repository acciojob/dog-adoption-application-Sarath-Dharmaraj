<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->

	<form method="post">
		<label for="name">Name</label>
		<input type="text" name="name" id="name" placeholder="Name" required> <br>
		<label for="phone">Phone Number</label>
		<input type="text" name="phone" id="phone" placeholder="Phone Number" required> <br>
		<label for="address">Address</label>
		<input type="text" name="address" id="address" placeholder="Address" required> <br>
		<label for="checkbox">Have you ever lived with a Dog before?</label>
		<input type="checkbox" name="checkbox" id="checkbox" required> <br>
		<label for="multiSelect">Please select your preferred breeds</label>
		<select name="multiSelect" id="multiSelect" multiple>
			<option value="1">dog 1</option>
			<option value="2">dog 2</option>
			<option value="3">dog 3</option>
		</select><br>
		<button type="submit" id="submit" value="Submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
